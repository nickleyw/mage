services:
  - type: web
    name: xmage-ipad-bridge
    runtime: docker
    plan: free
    dockerfilePath: ./Mage.WebBridge/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: XMAGE_BRIDGE_TOKEN
        generateValue: true
      - key: JAVA_OPTS
        value: -Xms64m -Xmx384m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC
