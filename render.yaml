services:
  - type: web
    name: xmage-ipad-bridge
    runtime: docker
    dockerfilePath: ./Mage.WebBridge/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: XMAGE_BRIDGE_TOKEN
        generateValue: true
      - key: JAVA_OPTS
        value: -Xms256m -Xmx1536m
    disk:
      name: xmage-card-data
      mountPath: /data
      sizeGB: 1
